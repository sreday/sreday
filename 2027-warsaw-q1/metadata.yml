# SREday Warsaw 2027 Q1 - hosted by Booksy (Zbigniew Kamiński, Head of SRE), agreed in the "Booksy <> SREday"
# thread: 24 Feb 2027 booked 2026-08-19; venue = Booksy office, Skyliner 28th floor; 80 people, 2 tracks; free.

# start time includes timezone at the end relative to UTC
start_time: "2027-02-24T09:00:00+01:00"
# before - no schedule
# active - schedule
# after  - hide ticket sales
event_state: before
date_string: "February 24, 2027"
location_string: "Booksy HQ, Warsaw, Poland"
city_name: "Warsaw"
calendly_sponsor_url: "https://calendly.com/sreday/30min"
# get this from the event url
luma_evt: evt-c1jEl5XJuQwGJMV
# free event (Luma confirms it too)
registration_free: true
cfp_url: https://cfp.ninja/e/sreday-2027-warsaw-q1

# the number of tracks needs to be the same per day
# the tracks will be taken in the order they appear in the CSV file
days: 1
attendees: 80
speakers: 10+
tracks: 2

rooms:
- main room
- secondary room

breaks:
- title: Coffee break
  duration: 30
  comment: Main lobby
  # this decides how many talks in-between this and previous section
  talks_before: 0
- title: Lunch & networking
  duration: 60
  comment: Main lobby
  talks_before: 4
- title: Networking & sponsor crawl
  duration: 30
  comment: Main lobby
  talks_before: 4

