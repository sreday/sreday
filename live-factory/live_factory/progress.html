<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talk factory</title>
<style>
  :root { --ink:#1d2430; --soft:#6b7380; --line:#e6e8ec; --bg:#f7f8fa; --blue:#098dcf; --green:#1f9d55; --red:#d64545; }
  * { box-sizing:border-box; }
  body { margin:0; font:17px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color:var(--ink);
         background:var(--bg); }
  main { max-width:860px; margin:0 auto; padding:28px 20px 60px; }
  h1 { font-size:28px; margin:0 0 4px; }
  .sub { color:var(--soft); margin:0 0 26px; }
  select { font:inherit; padding:4px 8px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin:0 0 18px; }
  h2 { font-size:19px; margin:0 0 14px; }
  .row { display:grid; grid-template-columns: 1fr 140px 52px; gap:14px; align-items:center; padding:7px 0; }
  .row .name { font-weight:600; }
  .row .what { color:var(--soft); font-size:15px; }
  .bar { height:12px; background:#eef0f3; border-radius:999px; overflow:hidden; }
  .bar > i { display:block; height:100%; width:0; background:var(--blue); border-radius:999px; transition:width .6s; }
  .done .bar > i { background:var(--green); }
  .problem .bar > i { background:var(--red); }
  .pct { text-align:right; color:var(--soft); font-variant-numeric:tabular-nums; }
  .done .pct { color:var(--green); }
  .problem .what { color:var(--red); }
  .waiting { opacity:.55; }
  .big { font-size:22px; font-weight:700; }
  .ok { color:var(--green); }
  ul.issues { margin:0; padding-left:22px; }
  ul.issues li { margin:4px 0; }
  .foot { color:var(--soft); font-size:13px; margin-top:26px; }
  .foot a { color:var(--soft); }
  .live { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--green); margin-right:6px;
          animation:pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity:.25; } }
  @media (max-width:560px) { .row { grid-template-columns: 1fr 90px 44px; } }
</style>
</head>
<body>
<main>
  <h1 id="title">Talk factory</h1>
  <p class="sub" id="sub">Loading...</p>
  <div class="card" id="done" hidden><div class="big ok">Finished - every talk is on YouTube.</div></div>
  <div class="card"><h2>The conference</h2><div id="stages"></div></div>
  <div class="card" id="talksCard" hidden><h2>The talks</h2><div id="talks"></div></div>
  <div class="card" id="issuesCard" hidden><h2 id="issuesHead">To look at</h2><ul class="issues" id="issues"></ul></div>
  <p class="foot"><span id="pick"></span> &middot; <a href="/workbench">details (workbench)</a></p>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let event = new URLSearchParams(location.search).get('event') || '';

function row(name, what, pct, state) {
  return `<div class="row ${state}"><div><div class="name">${esc(name)}</div>${what ? `<div class="what">${esc(what)}</div>` : ''}</div>
    <div class="bar"><i style="width:${pct}%"></i></div><div class="pct">${state === 'done' ? '&#10003;' : pct + '%'}</div></div>`;
}

async function events() {
  const list = await (await fetch('/api/events')).json();
  const started = list.filter(e => e.started);
  if (!event && started.length) event = started[0].id;
  if (!event && list.length) event = list[0].id;
  $('pick').innerHTML = 'Event: <select id="ev">' + (started.length ? started : list).map(e =>
    `<option value="${esc(e.id)}"${e.id === event ? ' selected' : ''}>${esc(e.id)}</option>`).join('') + '</select>';
  $('ev').onchange = () => { event = $('ev').value; history.replaceState(null, '', '?event=' + event); tick(); };
}

async function tick() {
  if (!event) return;
  let p;
  try { p = await (await fetch('/api/progress?e=' + encodeURIComponent(event))).json(); }
  catch (e) { $('sub').textContent = 'The factory app is not answering - start it again.'; return; }
  if (p.error) { $('sub').textContent = p.error; return; }
  document.title = p.title + ' - talk factory';
  $('title').textContent = p.title;
  $('sub').innerHTML = p.running ? '<span class="live"></span>Working on it - this page updates by itself.'
    : p.finished ? 'All done.' : p.report_ready ? 'Done, apart from what is listed below.' : 'Not running right now.';
  $('stages').innerHTML = p.stages.map(s => row(s.name, '', s.percent, s.state)).join('');
  $('talksCard').hidden = !p.talks.length;
  $('talks').innerHTML = p.talks.map(t => row(t.name, t.mission, t.percent, t.state)).join('');
  $('done').hidden = !p.finished;
  $('issuesCard').hidden = !p.issues.length;
  $('issuesHead').textContent = p.report_ready || p.finished ? 'Final report - what needs you' : 'So far - what needs you';
  $('issues').innerHTML = p.issues.map(i => `<li>${esc(i)}</li>`).join('');
}

events().then(tick);
setInterval(tick, 3000);
</script>
</body>
</html>
