# LIVE talk factory settings - change anything here (or in the local app) and the next run uses it.
# Per-machine overrides go in settings.local.yml next to this file (git-ignored).

# Brands: the site repo of each brand, a sibling of this repo (~/Documents/GitHub/<repo> on the Mac, the same
# folder on the PC); "." = this repo (SREday's, whatever its folder is called). Name, city, domain and the YouTube
# channel come from each event's metadata.yml.
brands:
  sreday: {repo: "."}
  llmday: {repo: llmday}
  platformday: {repo: platformday}
  pec: {repo: 2026.promptengineering.rocks}
  devopsnotdead: {repo: devopsnotdead}
# github_root: D:/GitHub       # where the brand repos live; default: the folder holding this repo

# Descript project that collects all talks of one event (one composition per talk).
# {event} = "SREday London 2026 Q1" (brand, city, year, quarter).
project_name: "{event}"

# ---- 1. analyse (local, free) ---------------------------------------------------------------------------------
# faster-whisper transcribes every recording once, so Claude can match it to the lineup. Only the timing and the
# names matter here, not a perfect transcript: "auto" = large-v3 on an NVIDIA card, small on the CPU (Mac).
whisper_model: auto
whisper_language: en
chunk_minutes: 30            # a recording is transcribed in pieces of this length (resumable, bounded memory)
frame_every_seconds: 120     # a still frame every N seconds for the lineup match (keyframes only: fast)
# The dashboard plays the recording itself when the browser can (H.264 in mp4/mov); anything else gets a 480p proxy.
proxy: auto                  # auto | always | never

# ---- 2. segment ------------------------------------------------------------------------------------------------
min_gap_seconds: 20          # a pause in speech at least this long is a possible boundary (talk change, break)
# Talks run 10-30 minutes (workshops longer): a cut far outside that is flagged.
talk_min_minutes: 10
talk_max_minutes: 30
# The closing Q&A ("any questions?" ... someone at the back without a microphone) in the first draft of the cuts: cut
# off when it clearly is one (the last 40% of the talk, at most max_qa_minutes long). The sharp ends below then take
# every Q&A out.
cut_qa: true
max_qa_minutes: 10

# ---- 2a. autopilot -------------------------------------------------------------------------------------------------
# Marek, 2026-11-27: "please ship talks from SREday London through live talk factory ... instead of asking for
# permission to run this further, you'll ship it and write a post-mortem ... ask for forgiveness not for permission".
# On autopilot Claude approves the cuts itself (approve), the factory checks every final itself (selfcheck.py) in
# place of the review in Descript, and the checked talks go to YouTube (youtube: below). Per event: "autopilot": true
# in cuts.json (python -m live_factory autopilot <event> on), which Claude sets when asked to ship an event.
autopilot: false

# ---- 2c. the transcript proofread (proofread.py) -------------------------------------------------------------------
# Marek, 2026-11-27: "download the descript transcript, proofread it in the context of the talk to catch and fix
# obvious problems, and upload to youtube videos as captions". glossary.yml first, then Claude (the Claude Code CLI on
# this computer, the person's own subscription - no API key) with the talk's title, abstract, speakers and company.
# Only misheard words change, never the timings; the Descript original stays in srt/descript/.
proofread_claude: true
proofread_model: opus        # the most careful reader (on Conf42's back catalogue it found far more than sonnet)
proofread_timeout_seconds: 900

# ---- 2b. sharp starts and ends (ends.py) ---------------------------------------------------------------------------
# Marek, 2026-11-27: "the beginnings and the ends of talks super sharp and production-ready ... Q&A need to always be
# outed ... end sharply at the moment when the person finishes, but letting him finish the sentence" - "full auto, so
# sharp cuts with guardrails". Every talk's edges are listened to again, closely (Whisper with word timestamps): it
# starts on the speaker's first words to the room (not the MC, the mic check, "are we good to go?"), and ends right
# after their last finished sentence before the Q&A - ideally the closing "thank you". A talk whose edges are not sure
# stops before cutting until Claude confirms them (ends_brief.md -> "ends" in cuts.json). "ends": "off" in a cut skips it.
sharp_ends: true
ends_whisper_model: large-v3 # the close listening at the edges, on every machine (a Mac's CPU too: a few minutes of
                             # sound per talk); the rules were learned on its punctuation
end_lead_seconds: 0.4        # the cut starts this long before the first word (in the quietest moment there) ...
end_tail_seconds: 0.8        # ... and ends this long after the last one
# Extra footage around every cut sent to Descript, for trimming by hand. With the sharp ends: none ("full auto"); a
# talk that needs other edges is cut again from the recording (redo). Never reaches into the next talk's own cut.
pad_before_seconds: 0
pad_after_seconds: 0
# Slides shown smaller than the frame, in black bars: zoom them to FIT the full frame (they grow until they touch its
# edges - nothing is cut off, whatever their shape). Only when the box is steady through the talk (a camera/slides mix
# or dark slides that fool the detection are left alone) and the zoom gains at least zoom_min_percent.
zoom_black_bars: true
zoom_min_percent: 5
cut_lead_seconds: 2          # the cut starts this long before the first word (Descript's trim fine-tunes it later)
cut_tail_seconds: 3          # ... and ends this long after the last one

# ---- 3. one-sided stereo -------------------------------------------------------------------------------------
# A channel this many dB below the other (in the talk's speech) counts as empty and gets the other channel's sound.
stereo_gap_db: 25
silent_channel_db: -60       # a channel below this RMS level is empty whatever the other one does

# ---- 3b. saturated sound (saturation.py) -----------------------------------------------------------------------
# Every talk's sound is listened to for peaks cut flat (a mic or recorder driven too hard). In this order:
#  1. the better track: a minute where the separate recorder is clipped and the camera is not gets the camera; a
#     clipped channel next to a clean one gets the clean one;
#  2. no choice: the worst 30 s go through every repair tool (declip_tools), Whisper and the clipping check judge
#     each; the best one that passes repairs the whole talk - which then gets the normal studio_sound_percent;
#  3. the last resort: a talk still SATURATED (2+ clipped minutes) gets saturated_studio_sound_percent.
# The tools: local/declip-env (requirements-declip.txt). "declip": "off" in a cut skips 1-2.
declip: true
declip_tools: [betterdeclipper:normal, voicefixer:0]   # tried in this order on the sample; the best that passes wins

# ---- 4. Descript ---------------------------------------------------------------------------------------------
studio_sound_percent: 80
saturated_studio_sound_percent: 100   # a talk whose sound is SATURATED (clipped peaks, saturation.py) gets this instead
volume_percent: 300          # Descript gain (3x) before the limiter
# (2026-10-16, first live run: "Remove all filler words" made Descript also mute real words its detector flagged -
# "your", "that", repeated words - and the limiter came out at -1 dB on one talk and -6 dB on the next. Both are
# spelled out now.)
gap_over_seconds: 2          # word gaps longer than this ...
gap_to_seconds: 1            # ... are shortened to this
max_edit_credits: 35         # an edit costing more pauses all further edits
edit_prompt: >-
  Work ONLY on the composition "{composition}" (the one this request is for).
  Do not open, edit or apply settings to any other composition or clip in the project.
  In "{composition}": apply Studio Sound at {studio_sound_percent}% intensity.
  Set the track gain to {volume_percent}%.
  Add a limiter: Descript has no dedicated limiter, so use the compressor with threshold -1 dB, ratio 20:1,
  attack 0 s, release 0.1 s, knee 0 dB.
  Remove ONLY the filler sounds um, uh, er, ah and hmm (and their spellings like umm, uhh, erm). Do not remove
  repeated words, false starts, "like", "you know", "so" or any other real word, even when the filler-word detection
  flags them - if in doubt, keep the word.
  Shorten every word gap longer than {gap_over_seconds} seconds to {gap_to_seconds} second.
  Do not change anything else.
  When done, list exactly which settings you applied and their values, and how many filler sounds you removed.
max_resolution: 1080p
publish_access: unlisted

# ---- output videos: lightweight MP4, best quality for the size --------------------------------------------------
# The cut that goes to Descript stays close to the source (Descript encodes it again). The finished video is H.264 in
# MP4 at constant quality (x264 CRF): a talk is mostly a still stage and slides, so it comes out a fraction of
# Descript's export and looks the same. Lower CRF = better and bigger (18 near-lossless, 21 sharp, 23 x264's default);
# slower preset = smaller at the same quality. If the result is ever bigger than Descript's export, the export's picture
# is kept as it is.
cut_crf: 18
final_crf: 21
final_preset: medium
final_audio_kbps: 160

# ---- disk space ------------------------------------------------------------------------------------------------
# Before adding, analysing or running, the factory works out what the whole job still needs on the work disk (copies,
# review copies, cuts, Descript's downloads, finished videos) and stops - with a desktop notification - if that plus
# this reserve is more than is free.
disk_reserve_gb: 10

# ---- 5. export -----------------------------------------------------------------------------------------------
trim_to_speech: true
trim_lead_seconds: 0.3
trim_tail_seconds: 1.0
loudness_lufs: -14
true_peak_db: -1.5
qa_loudness_tolerance: 1.0
qa_max_cut_percent: 25

# YouTube items per event: "<title> | <Speakers> | SREday London 2026 Q1" (<= title_max characters) + the description, in
# the channels' house style (read off 89 published SREday / LLMday talks, 2026-10-16). Values: {event} {date} {brand}
# {brand_key} {www_url} {talk_url} {event_url} {site_url} {cfp_url} {channel_url}; a line with an empty value is left out.
youtube:
  # ---- the upload (ytupload.py, Marek 2026-11-27): private, public "exactly 5 weeks after the conference" at 09:00
  # in the event city's own time zone; the event's playlist (made public when missing - its videos show as they go
  # public). Sign-in once per channel: python -m live_factory youtube-login <brand> <client_secret.json>
  # (the Conf42 factory's OAuth client); the token stays in ~/.live-factory/youtube/<brand>.json on this computer.
  # channels: the ONE channel per brand an upload may go to (filled from the sign-in); handles: the @name a sign-in
  # must have when no channel id is set yet. A metadata.yml video_release (ISO time) overrides the release.
  channels: {sreday: UCrdFcj7vBTOVyCpGhLNdCvQ, llmday: UCNqgrBft20Icfgwcxwu1iLw, platformday: UCTBbnEako2_9a1oLfgTeoCQ}
  handles: {sreday: sreday, llmday: llmday, platformday: platformday, pec: PromptEngineeringConf}
  # brands whose videos are NOT uploaded by the factory - finished in the final folder, handed over by hand (Marek
  # 2026-11-28: "put PEC to the wardrobe for now, it's a friend's channel and I don't have full permissions")
  no_upload: {pec: "a friend's channel - the finished videos stay in the final folder, to hand over"}
  release_days: 35
  release_time: "09:00"
  timezones:
    Amsterdam: Europe/Amsterdam
    Austin: America/Chicago
    Bangalore: Asia/Kolkata
    Barcelona: Europe/Madrid
    Campinas: America/Sao_Paulo
    Chennai: Asia/Kolkata
    Cologne: Europe/Berlin
    Dallas: America/Chicago
    Hamburg: Europe/Berlin
    Hyderabad: Asia/Kolkata
    Katowice: Europe/Warsaw
    Lisbon: Europe/Lisbon
    London: Europe/London
    Montevideo: America/Montevideo
    Munich: Europe/Berlin
    NYC: America/New_York
    New York: America/New_York
    Paris: Europe/Paris
    Redmond: America/Los_Angeles
    San Francisco: America/Los_Angeles
    Seattle: America/Los_Angeles
    Tel Aviv: Asia/Jerusalem
    Warsaw: Europe/Warsaw
  # each channel's own tag set, as the team tags every video (read from the channels 2026-11-27); the event and the
  # city are added per talk
  tags:
    sreday: [sre, incident response, observability, feature flags, simulations, autoscale, real-time, stream,
             processing, cloud]
    llmday: [llmday, large language models, LLM conference 2026, AI conference, artificial intelligence event,
             generative AI, GPT models, foundation models, enterprise AI, AI for developers]
    platformday: [platform, platform engineering, cloud native, DevOps, cloud computing, Kubernetes,
                  digital transformation, software engineering, IT conference, software architecture]
  playlist_title: "{event}"          # "SREday Dallas 2026 Q4", as the channels name them
  category_id: 28                    # Science & Technology
  title_max: 100
  description:
    - "{event} - {date}"
    - "Grab your ticket for the next {brand}: {www_url}"
    - "Upcoming {brand} CFPs: https://cfp.ninja/?q={brand_key}&status=open"

# ---- the Factory tab of sreday.com/factory (hidden) ---------------------------------------------------------------
# Every job ends by publishing this computer's progress (live-factory/status.json, pushed to the sreday repo); during a
# run also when a talk is ready for review or finished, at most every status_publish_minutes. false = never.
publish_status: true
status_publish_minutes: 20

# ---- places and pace -------------------------------------------------------------------------------------------
# One folder per event on the Desktop (or in work_root from settings.local.yml), named after the conference so several
# can run side by side: "video factory - LLMday Austin 2026 Q4". {event} = the event's name, {id} = llmday-2026-austin-q4.
event_folder: "video factory - {event}"
final_folder: final videos for YouTube   # inside the event's folder
render_parallel: 2                  # cuts rendered at once
parallel_talks: 2                   # talks going through Descript at once

# ---- 5. the picture and the sound (Marek, 2026-11-27: "the best quality sound and the best quality slides full
# screen - period. If there's a demo, then we switch to the inferior recording") -----------------------------------
# Deck pages: wherever the recording shows a page of the speaker's deck (Presenter View, a screen share with the
# taskbar, a headshot in the corner, a camera on a small TV), that stretch shows the page itself, sharp and full
# frame; build steps (bullets appearing one by one) are shown as they appeared. Demos, browsers, code and the speaker
# keep the recording. The deck: <work folder>/decks/<talk>.pdf, else the event's slides/<talk page>.pdf (deck dump).
# Per talk in cuts.json: "picture": "video" turns it off, "deck": "<path>" names the PDF.
slides_replace: true
# Night mode (a yellow, Night Shift screen share): the deck pages fix it by themselves; the stretches that stay video
# get their colours put back (white point of the screen) when the picture is a screen recording.
night_mode_fix: true
# Separate sound: a sound-only file added to the event (a recorder on the desk) is placed on the videos by itself and
# its sound replaces the camera's wherever it covers a talk (the camera fills any hole). Per talk in cuts.json:
# "sound": "camera" keeps the camera's own.
separate_sound: true
# Talks whose picture plans are made at the same time at the start of a run (and by `look`). Default: a quarter of the
# CPU threads, at least 2 - the factory may use the whole machine (Marek: "go ham, I won't use this computer").
# look_parallel: 6
