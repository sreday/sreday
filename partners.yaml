  - kubespaces.png
  - gdg_london.png
  - NL_MEETUP.png
  - chennaisre.png
  - srecommunitycoimbatore.png
  - srehyderabadi.png
  - aigeeks.png
  - cloud native lisbon.png
  - cloud native porto.png
  - devops braga.png
  - devops lisbon.png
  - kcd porto.png
  - leiria tech talks.png
  - viseu tech talks.png
  - lisbon genai community.png
  - aws porto.png
  - synvert xgeeks.png

sister_conferences_job_boards:
  - IacConf.png
  - devit.png
  - devitjobs.png
  - DevIT-usa.png

# Extra logo files of companies already shown under another filename
hidden_duplicates:
  - kube_events.png     # duplicate of kube-events.png
  - devit.png           # DevITjobs - shown as devitjobs.png
  - DevIT-usa.png       # DevITjobs - shown as devitjobs.png
