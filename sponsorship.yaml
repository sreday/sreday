tiers:
  - id: leads
    name: "Conference Leads"
    highlight: false
    requires: "Cannot be purchased solo"
    price:
      small: 500
      medium: 1000
      large: 1000
    benefits:
      - "Receive full attendee contact list"

  - id: keynote
    name: "Keynote Session"
    highlight: false
    price:
      small: 1000
      medium: 3000
      large: 5000
    benefits:
      - "30-minute morning slot"
      - "100% audience — no parallel talks"

  - id: workshop
    name: "Workshop"
    highlight: false
    price:
      small: 1000
      medium: 3000
      large: 5000
    benefits:
      - "60-minute slot"
      - "Let attendees play with your tech"

  - id: talk
    name: "Regular Session Slot"
    highlight: false
    price:
      small: 500
      medium: 2000
      large: 2000
    benefits:
      - "30-minute afternoon slot"
      - "May run alongside parallel tracks"

  - id: booth
    name: "Booth / Table"
    highlight: false
    price:
      small: 1000
      medium: 2000
      large: 4000
    benefits:
      - "Table (150 × 100cm), optional 24-inch monitor"
      - "Electricity, Wi-Fi, space for a rollup banner"

  - id: logo_swag
    name: "Logo Sponsor + Swag"
    highlight: false
    price:
      small: 500
      medium: 1000
      large: 1000
    benefits:
      - "Logo on the website, on-stage mention"
      - "Swag distributed to all attendees"

  - id: food
    name: "Coffee Break / Lunch / Happy Hour"
    highlight: false
    price_label:
      small: "£500 + £10pp"
      medium: "£1000 + £15pp"
      large: "£1000 + £15pp"
    benefits:
      - "Microphone time before the selected break"
      - "Distribute your swag alongside food & drinks"

  - id: clothing
    name: "Branded Wearables"
    highlight: false
    price_label:
      small: "£500 + variable"
      medium: "£1000 + variable"
      large: "£1000 + variable"
    benefits:
      - "Your logo on t-shirts, hoodies, socks, etc."
      - "Price per person depends on the item"

  - id: startup_discount
    name: "Check eligibility for"
    highlight: false
    price_label: "20% Discount"
    benefits:
      - "Early-stage startups under $5M in funding"
      - "Sponsoring 3+ events in a year"

#on request:

  - id: host
    name: "Host LLMday / SREday / PLATFORMday"
    highlight: false
    price_label: "On request"

  - id: co_located
    name: "Co-located Event"
    highlight: false
    price_label: "On request"

  - id: hackathon
    name: "Hackathon"
    highlight: false
    price_label: "On request"

  - id: meetup
